name: Build ntfy v1.4.1 unsigned IPA for iOS 14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
name: Build ntfy v1.4.1 unsigned IPA for iOS 14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out ntfy iOS v1.4.1
        uses: actions/checkout@v5
        with:
          repository: binwiederhier/ntfy-ios
          ref: v1.4.1
          fetch-depth: 1

      - name: Create dummy Firebase plist
        run: |
          cat > ntfy/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key><string>dummy</string>
            <key>REVERSED_CLIENT_ID</key><string>dummy</string>
            <key>API_KEY</key><string>dummy</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>io.heckel.ntfy</string>
            <key>PROJECT_ID</key><string>dummy</string>
            <key>STORAGE_BUCKET</key><string>dummy</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>DATABASE_URL</key><string>https://dummy.firebaseio.com</string>
          </dict>
          </plist>
          PLIST

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS device without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ntfy.xcodeproj \
            -scheme ntfy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ntfy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/package/Payload/ntfy.app"
          cd "$RUNNER_TEMP/package"
          zip -r "$GITHUB_WORKSPACE/ntfy-v1.4.1-ios14-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ntfy-v1.4.1-ios14-unsigned
          path: ntfy-v1.4.1-ios14-unsigned.ipa
          retention-days: 7sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            build

      - name: Package the app as an IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ntfy.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/package/Payload/ntfy.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "$GITHUB_WORKSPACE/ntfy-v1.4.1-ios14-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-v1.4.1-ios14-unsigned
          path: ntfy-v1.4.1-ios14-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
